model: csg_ode
dataset: springs
num_nodes: 5
input_dim: 4
batch_size: 256
observation_embedding_dim: 64
node_parameter_dim: 32
hidden_dim: 16
latent_dim: 16
augment_dim: 64
subnetwork_width: 128
subnetwork_depth: 1
num_subnetworks: 2
num_relations: 2
epochs: 50
learning_rate: 0.0005
weight_decay: 0.001
dropout: 0.2
grad_clip: 10.0
alpha: 0.5
solver: euler
normalization_mode: paper_splitwise_maxabs
